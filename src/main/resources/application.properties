spring.application.name=BriefDrop

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/briefdrop
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${BRIEFDROP_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# --- H2 in-memory (dev only, uncomment and comment above) ---
# spring.datasource.url=jdbc:h2:mem:briefdrop;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/

# DevTools
spring.devtools.restart.enabled=true

